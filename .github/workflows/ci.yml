name: ci

# Two checks only: everything compiles, and the contract tests pass.
# torch is intentionally NOT installed: CI must stay fast and environment-proof.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all python files
        run: python -m compileall -q src analysis tests

      - name: Contract tests
        run: python -m unittest discover -s tests -v
