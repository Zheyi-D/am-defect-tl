# Configuration template: copy it to configs/<model>.yaml and change the model field.
# owner: whoever is responsible for that model maintains this file; changes to shared fields
# (input_size / freeze / head) must go through a PR in the foundation group first.

model: "<vgg16|vgg19|resnet50|resnet101|inception_resnet_v2|xception|mobilenet_v2|efficientnet_b0|efficientnet_b7|efficientnet_v2m|nasnet_large>"
pretrained: imagenet
freeze: all_conv            # paper setting: freeze every convolution layer and train only the new head

# Paper-style head (Keras: AveragePooling2D(4,4) -> Flatten -> Dense -> Dropout(0.5) -> Dense(softmax))
head:
  pooling: [4, 4]
  dense_units: 64           # taken from Dense(64, relu) in the authors' notebook (not stated in the paper, see docs/AUTHOR_CODE.md section 3)
  dropout: 0.5

# Online augmentation during training: the authors' notebook uses ImageDataGenerator(rotation_range=15, fill_mode="nearest")
# Note that D2 is already an offline-augmented dataset, so adding online augmentation means double augmentation,
# which must be explained in the report.
# The main matrix keeps it off (faster, and it makes feature caching easier); a separate on/off ablation goes in the report.
train_aug:
  rotation_degrees: 15
  fill_mode: nearest
  enabled: false

dataset: "D1"               # D1 | D2 | D2p
split_file: "splits/D1.csv"
input_size: 224
num_classes: 2

optimizer: adam             # adam | sgd | rmsprop
lr: 0.001
batch_size: 8               # paper Study One = 8; Study Two = 50 (use 32 + gradient accumulation if memory is short)
epochs: 30                  # paper Study One = 30; Study Two = 50
weight_decay: 0.0
momentum: 0.9               # only effective for sgd

early_stopping:
  enabled: false            # not used by the paper; if enabled it must be documented in the report
  patience: 5

seed: 42
num_workers: 2
amp: true                   # mixed precision, can be enabled on a Kaggle T4

output_dir: "results/runs"
